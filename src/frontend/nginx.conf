# One origin for the app and the API, as the Vite dev proxy does, so the SameSite=Strict cookies keep working.
server {
    listen 80;
    root /usr/share/nginx/html;

    # Exam packages go up to 300 MB (AdminPapersController.MaxPackageBytes).
    client_max_body_size 300m;

    location /api/ {
        proxy_pass http://api:8080;
        # $http_host keeps the port: Safe Exam Browser hashes the full URL it requested (VE-28).
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }

    # VE-13: SignalR hubs (WebSockets; long polling as a fallback).
    location /hubs/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    location = /health {
        proxy_pass http://api:8080;
    }

    # Vite puts content-hashed files here.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # /staff/... and the candidate screen are client-side routes.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
