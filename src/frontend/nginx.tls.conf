# Production (docker/docker-compose.prod.yml mounts this over conf.d/default.conf): HTTPS on 443 with the certificate
# in docker/certs/ (server.crt and server.key, never committed; setup/INSTALL.md shows how to make one), and port 80
# only sends browsers to HTTPS. Cookies are Secure-only in Production, so they work only over HTTPS.
server {
    listen 80;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    include /etc/nginx/snippets/examprep-app.conf;
}
