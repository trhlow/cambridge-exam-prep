# VE-31: a separate stack for the Playwright end-to-end tests, so they never touch the demo database.
# Run from the repo root (own project name, ports and MySQL volume; the demo exam uses the self-written samples):
#   WEB_PORT=8090 MYSQL_PORT=3307 docker compose -p examprep-e2e -f docker/docker-compose.yml -f docker/docker-compose.e2e.yml --env-file docker/.env up -d --build
#   (cd src/frontend && npm run e2e)
#   WEB_PORT=8090 MYSQL_PORT=3307 docker compose -p examprep-e2e -f docker/docker-compose.yml -f docker/docker-compose.e2e.yml --env-file docker/.env down -v
services:
  api:
    environment:
      Demo__ReadingWritingFolder: ""
      Demo__ListeningFolder: ""
      Demo__SecondReadingWritingFolder: ""
      Demo__SecondListeningFolder: ""
      # The B1 exam uses the self-written B1 samples, each mixed with itself, so seats still get versions 1–4.
      Demo__B1__Reading__Folder: ""
      Demo__B1__Reading__SecondFolder: /demo/samples/b1-pfs-reading
      Demo__B1__Writing__Folder: ""
      Demo__B1__Writing__SecondFolder: /demo/samples/b1-pfs-writing
      Demo__B1__Listening__Folder: ""
      Demo__B1__Listening__SecondFolder: /demo/samples/b1-pfs-listening
