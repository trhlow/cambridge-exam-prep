# Whole system in one command (MySQL + API + web), or MySQL alone for development with dotnet run / npm run dev:
#   docker compose -f docker/docker-compose.yml --env-file docker/.env up -d --build    -> http://localhost:8080
#   docker compose -f docker/docker-compose.yml --env-file docker/.env up -d mysql
# Copy .env.example to .env and set real passwords first.
name: examprep

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in docker/.env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-examprep}
      MYSQL_USER: ${MYSQL_USER:-examprep}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in docker/.env}
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Same database and App_Data as `dotnet run`, so papers, sessions and sign-ins carry over between the two.
  # Development environment: it seeds the demo A2 exam (Demo section of appsettings.Development.json).
  api:
    build:
      context: ../src/backend
      # The PDF converter (setup/exam-package/.dockerignore keeps exam content and samples out).
      additional_contexts:
        converter: ../setup/exam-package
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__ExamPrep: "server=mysql;port=3306;database=${MYSQL_DATABASE:-examprep};user=${MYSQL_USER:-examprep};password=${MYSQL_PASSWORD}"
      Database__MigrateOnStart: "true"
      # The expiry worker queries every 5 s; keep its SQL out of `docker compose logs api`.
      Logging__LogLevel__Microsoft.EntityFrameworkCore: Warning
      # Only used while the database has no administrator yet.
      Bootstrap__AdminUsername: ${BOOTSTRAP_ADMIN_USERNAME:-}
      Bootstrap__AdminPassword: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      Demo__SamplesRoot: /demo/samples
      Demo__ReadingWritingFolder: /demo/sources/a2-key-fs-2022-sample/package-reading-writing
      Demo__ListeningFolder: /demo/sources/a2-key-fs-2022-sample/package-listening
      Demo__SecondReadingWritingFolder: /demo/sources/a2-key-2020-sample/package-reading-writing
      Demo__SecondListeningFolder: /demo/sources/a2-key-2020-sample/package-listening
      # VE-68: the B1 demo exam mixes the two B1 sample sets section by section.
      Demo__B1__Reading__Folder: /demo/sources/b1-pet-fs-sample/package-reading
      Demo__B1__Reading__SecondFolder: /demo/sources/b1-pet-2022-sample/package-reading
      Demo__B1__Writing__Folder: /demo/sources/b1-pet-fs-sample/package-writing
      Demo__B1__Writing__SecondFolder: /demo/sources/b1-pet-2022-sample/package-writing
      Demo__B1__Listening__Folder: /demo/sources/b1-pet-fs-sample/package-listening
      Demo__B1__Listening__SecondFolder: /demo/sources/b1-pet-2022-sample/package-listening
    volumes:
      - ../src/backend/src/ExamPrep.Api/App_Data:/app/App_Data
      - ../setup/exam-package/samples:/demo/samples:ro
      - ../setup/exam-package/sources:/demo/sources:ro

  web:
    build: ../src/frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  mysql-data:
